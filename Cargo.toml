[package]
name = "profile-metrics"
version = "0.1.0"
edition = "2021"
description = "Generates transparent light and dark GitHub metrics SVGs for jpmasangkay."

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
